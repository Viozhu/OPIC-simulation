[project]
name = "opic"
version = "0.1.0"
description = "Local OPIc speaking-test simulator"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
markers = [
    "models: needs a real local model (Ollama, Whisper) or macOS `say`; excluded by default",
]
addopts = "-m 'not models'"
